vectornav:
  ros__parameters:
    port: "/dev/vectornav"
    #3.2.2 Baud Rate
    baud: 115200
    reconnect_ms: 500
    adjust_ros_timestamp: True # FIXME: What does this do?
    frame_id: "imu"

    # Async Output Type (ASCII) 3.2.3
    AsyncDataOutputType: 0           # (0: Binary, 1+:specifies ASCII message to send)
  
    BO1:
      asyncMode: 1                   # serial port 1
      rateDivisor: 10                # 800 / 10 = 80 Hz
      commonField: 0x0319 #0x219             # imu, quaternion, ypr, time startup
      timeField: 0x0000              # TIMEGROUP_NONE
      imuField: 0x0100               # magnetometer data enable
      attitudeField: 0x0000          # ATTITUDEGROUP_NONE
      gpsField: 0x0000
      insField: 0x0000
      gps2Field: 0x0000
    # Binary output register 2
    BO2:
      asyncMode: 0                   # ASYNCMODE_NONE
      rateDivisor: 0
      commonField: 0x0000            # COMMONGROUP_NONE
      timeField: 0x0000              # TIMEGROUP_NONE
      imuField: 0x0000               # IMUGROUP_NONE
      gpsField: 0x0000               # GPSGROUP_NONE
      attitudeField: 0x0000          # ATTITUDEGROUP_NONE
      insField: 0x0000               # INSGROUP_NONE
      gps2Field: 0x0000              # GPSGROUP_NONE
    # Binary output register 3
    BO3:
      asyncMode: 0                   # ASYNCMODE_NONE
      rateDivisor: 0
      commonField: 0x0000            # COMMONGROUP_NONE
      timeField: 0x0000              # TIMEGROUP_NONE
      imuField: 0x0000               # IMUGROUP_NONE
      gpsField: 0x0000               # GPSGROUP_NONE
      attitudeField: 0x0000          # ATTITUDEGROUP_NONE
      insField: 0x0000               # INSGROUP_NONE
      gps2Field: 0x0000              # GPSGROUP_NONE
    
    velocity_aiding_topic: "gps/velocity"
    use_mag_model: true
    use_grav_model: true
    recalc_threshold: 1000
    WMM_latitude: 36.18068433
    WMM_longitude: -85.49182190
    WMM_altitude: 320.0

    print_sensor_status: true

vn_sensor_msgs:
  ros__parameters:
    model: "vn100" #vn100, vn200, vn300
    publish_time_sync_in: false
    publish_time_startup: false
    use_enu: true  # this will convert from Forward-Right-Down body axes in NED to Right-Forward-Up body axes in ENU

    orientation_covariance: [0.01,  0.0,   0.0,
                            0.0,   0.01,  0.0,
                            0.0,   0.0,   0.01]
    angular_velocity_covariance: [0.01,  0.0,   0.0,
                         0.0,   0.01,  0.0,
                         0.0,   0.0,   0.01]
    linear_acceleration_covariance: [0.01,  0.0,   0.0,
                         0.0,   0.01,  0.0,
                         0.0,   0.0,   0.01]
    magnetic_covariance: [0.01,  0.0,   0.0,
                         0.0,   0.01,  0.0,
                         0.0,   0.0,   0.01]

    roll: 3.1415
    pitch: 0.0
    yaw: 3.1415

